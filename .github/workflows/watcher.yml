name: ClickUp status watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min UTC (24/7; KSA = UTC+3)
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed state only — record statuses, send no email"
        type: boolean
        default: false

permissions:
  contents: write            # needed to commit the state file back

concurrency:
  group: clickup-status-watcher
  cancel-in-progress: false  # never run two copies at once

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pytz

      - name: Run watcher
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASS:     ${{ secrets.SMTP_PASS }}
          SEED:          ${{ inputs.seed && '1' || '0' }}
        run: python src/clickup_status_watcher.py

      - name: Persist state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/clickup_status_state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: clickup status state [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
